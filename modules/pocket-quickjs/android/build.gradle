plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.darbyjack.pockettools'
version = '0.1.0'

android {
  namespace 'com.darbyjack.pockettools.quickjs'

  defaultConfig {
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared'
        cppFlags '-std=c++20 -fexceptions -frtti'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  packagingOptions {
    excludes += ['**/libc++_shared.so']
  }
}
