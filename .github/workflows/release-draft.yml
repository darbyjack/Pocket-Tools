name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag matching committed application metadata
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pocket-tools-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.identity.outputs.prerelease }}
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository gate
        run: pnpm check
      - id: identity
        name: Validate release identity
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm release:validate --tag "$TAG"

          source="$(git rev-parse HEAD)"
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "prerelease=$prerelease"
            echo "source=$source"
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build unsigned ${{ matrix.abi }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24.18.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          cache: gradle
          distribution: temurin
          java-version: 17
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inspect unsigned APK
        env:
          CI: "true"
          TAG: ${{ needs.validate.outputs.tag }}
        run: pnpm release:android:build --tag "$TAG" --abi "${{ matrix.abi }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: unsigned-${{ matrix.abi }}
          path: |
            release-work/intermediate/${{ needs.validate.outputs.version }}/pocket-tools-${{ needs.validate.outputs.tag }}-${{ matrix.abi }}-unsigned.apk
            release-work/intermediate/${{ needs.validate.outputs.version }}/pocket-tools-${{ needs.validate.outputs.tag }}-${{ matrix.abi }}-unsigned.apk.inspection.json
          retention-days: 1

  collect:
    name: Verify unsigned handoff
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: release-work/intermediate/${{ needs.validate.outputs.version }}
          pattern: unsigned-*
      - name: Verify exact unsigned artifact set and provenance
        env:
          SOURCE: ${{ needs.validate.outputs.source }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-release-collect.mjs validate-unsigned \
            --tag "$TAG" \
            --directory "release-work/intermediate/$VERSION" \
            --source "$SOURCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: unsigned-release-${{ needs.validate.outputs.tag }}
          path: release-work/intermediate/${{ needs.validate.outputs.version }}
          retention-days: 1

  sign:
    name: Sign and stage release
    needs:
      - validate
      - collect
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24.18.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          cache: gradle
          distribution: temurin
          java-version: 17
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ needs.validate.outputs.tag }}
          path: release-work/intermediate/${{ needs.validate.outputs.version }}
      - name: Decode protected signing identity
        id: keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/pocket-tools-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"
      - name: Sign, inspect, stage, and verify exact assets
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEYSTORE: ${{ steps.keystore.outputs.path }}
          SOURCE: ${{ needs.validate.outputs.source }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"

          intermediate="release-work/intermediate/$VERSION"
          final_input="release-work/final-input/$VERSION"
          staging="release-staging/$TAG"
          publication="release-work/publication/$VERSION"
          mkdir -p "$final_input"

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unsigned="$intermediate/pocket-tools-$TAG-$abi-unsigned.apk"
            signed="$final_input/pocket-tools-$TAG-$abi.apk"

            pnpm release:android:sign \
              --input "$unsigned" \
              --output "$signed" \
              --keystore "$KEYSTORE" \
              --alias "$ANDROID_RELEASE_KEY_ALIAS"

            pnpm release:android:inspect \
              --tag "$TAG" \
              --abi "$abi" \
              --apk "$signed" \
              --certificate-subject "CN=Pocket Tools Release" \
              --output "$signed.inspection.json"
          done

          pnpm release:android:certificate \
            --apk "$final_input/pocket-tools-$TAG-arm64-v8a.apk" \
            --output "$final_input/pocket-tools-release-certificate.pem"

          pnpm release:stage \
            --tag "$TAG" \
            --input "$final_input" \
            --output "$staging" \
            --publication "$publication"

          pnpm release:verify --tag "$TAG" --directory "$staging"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: signed-release-${{ needs.validate.outputs.tag }}
          path: |
            release-staging/${{ needs.validate.outputs.tag }}
            release-work/publication/${{ needs.validate.outputs.version }}
          retention-days: 1
      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/pocket-tools-release.p12"

  attest:
    name: Attest signed APKs
    needs:
      - validate
      - sign
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.validate.outputs.tag }}
          path: .
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-staging/${{ needs.validate.outputs.tag }}/*.apk

  draft:
    name: Create draft GitHub Release
    needs:
      - validate
      - attest
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      SOURCE: ${{ needs.validate.outputs.source }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.validate.outputs.tag }}
          path: .
      - name: Reverify downloaded exact bytes
        shell: bash
        run: node scripts/release-engineering.mjs verify-directory --tag "$TAG" --directory "release-staging/$TAG"
      - name: Create or replace draft assets
        shell: bash
        run: |
          set -euo pipefail

          staging="release-staging/$TAG"
          notes="release-work/publication/$VERSION/pocket-tools-$TAG-release-notes.md"

          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"

            while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

            gh release edit "$TAG" \
              --draft \
              --notes-file "$notes" \
              --prerelease="$PRERELEASE" \
              --target "$SOURCE" \
              --title "Pocket Tools $TAG"
            gh release upload "$TAG" "$staging"/*
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "$staging"/* --draft --prerelease --target "$SOURCE" --title "Pocket Tools $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$staging"/* --draft --target "$SOURCE" --title "Pocket Tools $TAG" --notes-file "$notes"
          fi
