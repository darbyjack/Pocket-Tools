name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      abis: ${{ steps.paths.outputs.abis }}
      android: ${{ steps.paths.outputs.android }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - id: paths
        name: Classify repository paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BASE_SHA"
              head="$PUSH_HEAD_SHA"
              ;;
            workflow_dispatch)
              head="$(git rev-parse HEAD)"
              base="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          node scripts/ci-paths.mjs classify \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

  fast:
    name: Fast repository gate
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate portable legal artifacts
        run: |
          pnpm licenses:pnpm:write
          pnpm sbom:write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: portable-legal-artifacts
          path: |
            licenses/pnpm-production.json
            licenses/pocket-tools.spdx.json
          retention-days: 1
      - name: Run repository gate
        run: pnpm check
      - name: Require committed generated artifacts
        run: git diff --exit-code -- licenses/pnpm-production.json licenses/pocket-tools.spdx.json

  android-smoke:
    name: Android smoke (${{ matrix.abi }})
    if: needs.fast.result == 'success' && needs.classify.outputs.android == 'true'
    needs:
      - classify
      - fast
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.classify.outputs.abis) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24.18.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          cache: gradle
          distribution: temurin
          java-version: 17
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inspect isolated ABI
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          pnpm release:android:build --tag "$tag" --abi "${{ matrix.abi }}"

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - classify
      - fast
      - android-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required job results
        env:
          ANDROID_REQUIRED: ${{ needs.classify.outputs.android }}
          ANDROID_RESULT: ${{ needs.android-smoke.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_RESULT: ${{ needs.fast.result }}
        shell: bash
        run: |
          set -euo pipefail

          test "$CLASSIFY_RESULT" = "success"
          test "$FAST_RESULT" = "success"

          if [ "$ANDROID_REQUIRED" = "true" ]; then
            test "$ANDROID_RESULT" = "success"
          else
            test "$ANDROID_RESULT" = "skipped" -o "$ANDROID_RESULT" = "success"
          fi
